<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ST-AAZeus · 本地模型对话台</title>
<style>
  :root {
    --bg: #101216; --panel: #1a1e25; --panel2: #22272f; --line: #2d333d;
    --text: #d7dce4; --dim: #8b94a3; --accent: #6ea8fe; --accent2: #8fd0a0;
    --user: #2b3a55; --err: #e07a6b;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; flex-direction: column;
    background: var(--bg); color: var(--text);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    font-size: 14px;
  }
  /* ---- 顶栏 ---- */
  header {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .logo { font-weight: 700; font-size: 15px; color: var(--accent); white-space: nowrap; }
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 3px 10px; border-radius: 12px; font-size: 12px;
    background: var(--panel2); border: 1px solid var(--line); color: var(--dim);
  }
  .pill .dot { width: 8px; height: 8px; border-radius: 50%; background: #666; }
  .pill.running .dot { background: var(--accent2); }
  .pill.starting .dot { background: #e0c36b; animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .pill.running { color: var(--accent2); }
  .pill.starting { color: #e0c36b; }
  select, button, textarea {
    font-family: inherit; font-size: 13px; color: var(--text);
    background: var(--panel2); border: 1px solid var(--line); border-radius: 8px;
    padding: 6px 10px; outline: none;
  }
  select:focus, textarea:focus { border-color: var(--accent); }
  button { cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #0d1522; font-weight: 600; }
  button.primary:hover { filter: brightness(1.1); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .hint { color: var(--dim); font-size: 12px; }
  .err-line { color: var(--err); font-size: 12px; }
  label.chk { display: inline-flex; align-items: center; gap: 5px; color: var(--dim); font-size: 12px; user-select: none; }
  /* ---- 消息区 ---- */
  main { flex: 1; overflow-y: auto; padding: 18px 16px; }
  .msg { max-width: 860px; margin: 0 auto 14px; display: flex; }
  .msg.user { justify-content: flex-end; }
  .bubble {
    padding: 10px 14px; border-radius: 12px; white-space: pre-wrap;
    word-break: break-word; line-height: 1.65;
  }
  .msg.user .bubble { background: var(--user); border-top-right-radius: 4px; }
  .msg.ai .bubble { background: var(--panel); border: 1px solid var(--line); border-top-left-radius: 4px; flex: 1; }
  .msg.ai .bubble.error { border-color: var(--err); color: var(--err); }
  details.think {
    margin-bottom: 8px; border-left: 3px solid var(--line); padding-left: 10px;
    color: var(--dim); font-size: 12.5px;
  }
  details.think summary { cursor: pointer; user-select: none; color: var(--dim); }
  details.think .tbody { white-space: pre-wrap; margin-top: 6px; line-height: 1.55; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--accent);
            vertical-align: text-bottom; animation: blink 1s infinite; }
  /* ---- 输入区 ---- */
  footer { padding: 12px 16px 16px; background: var(--panel); border-top: 1px solid var(--line); }
  .inrow { max-width: 860px; margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  textarea#inp {
    flex: 1; resize: none; max-height: 160px; min-height: 44px; line-height: 1.5;
  }
  .foot-hint { max-width: 860px; margin: 8px auto 0; display: flex; justify-content: space-between; }
</style>
</head>
<body>
<header>
  <span class="logo">⚡ ST-AAZeus</span>
  <span class="pill" id="statusPill"><span class="dot"></span><span id="statusText">检查中…</span></span>
  <select id="modelSel" title="模型"></select>
  <select id="variantSel" title="变体/精度"></select>
  <button class="primary" id="btnStart">启动</button>
  <button id="btnStop">停止</button>
  <label class="chk" title="关闭后模型直接输出正文，不再生成思考过程">
    <input type="checkbox" id="thinkChk" checked> 思考模式
  </label>
</header>

<main id="chat"></main>

<footer>
  <div class="inrow">
    <textarea id="inp" placeholder="输入消息，Enter 发送，Shift+Enter 换行" rows="1"></textarea>
    <button class="primary" id="btnSend" style="height:44px;padding:0 22px;">发送</button>
  </div>
  <div class="foot-hint">
    <span class="hint">本地模型 · OpenAI 兼容接口流式输出 · 对话保存在本页会话内</span>
    <span class="hint" id="metaInfo"></span>
  </div>
</footer>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const chat = $("chat"), inp = $("inp"), btnSend = $("btnSend");
let history = [];          // [{role, content}] 多轮上下文
let generating = false;
let modelsCache = [];

/* ---------- 状态轮询 ---------- */
function setPill(status, text) {
  const pill = $("statusPill");
  pill.className = "pill " + (status === "running" ? "running" : status === "starting" ? "starting" : "");
  $("statusText").textContent = text;
}

async function refreshStatus() {
  try {
    const s = await (await fetch("/api/status")).json();
    if (s.status === "running") {
      const bits = [s.model_id];
      if (s.quant) bits.push(String(s.quant).split(" ")[0]);
      if (s.n_ctx) bits.push("ctx " + s.n_ctx);
      setPill("running", "● " + bits.filter(Boolean).join(" · "));
      $("metaInfo").textContent = s.model_file ? ("模型文件: " + s.model_file) : "";
      if (s.last_error) console.warn("上次错误已清除:", s.last_error);
    } else if (s.status === "starting") {
      setPill("starting", "◐ 启动中: " + s.starting + " …");
    } else {
      const err = s.last_error ? (" — " + s.last_error) : "";
      setPill("", "○ 未运行" + err);
      $("metaInfo").textContent = "";
    }
    updateButtons(s.status);
  } catch (e) { setPill("", "○ 控制台服务异常"); }
}

function updateButtons(status) {
  const running = status === "running";
  $("btnStart").disabled = (status === "starting" || running);
  $("btnStop").disabled = !running;
  btnSend.disabled = !running || generating;
  inp.disabled = !running;
}

/* ---------- 模型清单 ---------- */
function fillVariants() {
  const m = modelsCache.find(x => x.id === $("modelSel").value) || modelsCache[0];
  const vs = $("variantSel");
  vs.innerHTML = "";
  (m && m.variants ? m.variants : [{name: ""}]).forEach(v => {
    const o = document.createElement("option");
    o.value = v.name || "";
    o.textContent = v.name ? (v.name + (v.size_gb ? ` (${v.size_gb}G)` : "")) : "默认";
    vs.appendChild(o);
  });
  if (m && m.default_variant) vs.value = m.default_variant;
}

async function loadModels() {
  try {
    const d = await (await fetch("/api/models")).json();
    modelsCache = d.models || [];
    const sel = $("modelSel");
    sel.innerHTML = "";
    modelsCache.forEach(m => {
      const o = document.createElement("option");
      o.value = m.id; o.textContent = m.display_name;
      sel.appendChild(o);
    });
    fillVariants();
    sel.onchange = fillVariants;
  } catch (e) { console.error(e); }
}

/* ---------- 启停 ---------- */
$("btnStart").onclick = async () => {
  appendSys("正在启动 " + $("modelSel").value + ($("variantSel").value ? "(" + $("variantSel").value + ")" : "") + "，加载约需 20~60 秒…");
  await fetch("/api/start", {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({model: $("modelSel").value, variant: $("variantSel").value})
  });
};

$("btnStop").onclick = async () => {
  generating = false;
  appendSys("正在停止模型服务…");
  await fetch("/api/stop", {method: "POST"});
};

/* ---------- 消息渲染 ---------- */
function esc(t) {
  const d = document.createElement("div"); d.textContent = t; return d.innerHTML;
}
function appendUser(text) {
  const div = document.createElement("div");
  div.className = "msg user";
  div.innerHTML = `<div class="bubble">${esc(text)}</div>`;
  chat.appendChild(div); scrollDown();
}
function appendSys(text) {
  const div = document.createElement("div");
  div.className = "msg ai";
  div.innerHTML = `<div class="bubble" style="color:var(--dim);font-size:12.5px">${esc(text)}</div>`;
  chat.appendChild(div); scrollDown();
}
function appendAssistant() {
  const div = document.createElement("div");
  div.className = "msg ai";
  div.innerHTML = `<div class="bubble">
      <details class="think" style="display:none"><summary>思考过程</summary><div class="tbody"></div></details>
      <div class="ans"></div><span class="cursor"></span>
    </div>`;
  chat.appendChild(div); scrollDown();
  return {
    root: div,
    thinkBox: div.querySelector("details.think"),
    thinkBody: div.querySelector(".tbody"),
    ans: div.querySelector(".ans"),
    cursor: div.querySelector(".cursor"),
    err() { div.querySelector(".bubble").classList.add("error"); },
  };
}
function scrollDown() { chat.scrollTop = chat.scrollHeight; }

/* ---------- 发送（SSE 流式） ---------- */
async function send() {
  const text = inp.value.trim();
  if (!text || generating) return;
  inp.value = ""; inp.style.height = "auto";
  generating = true; updateButtons("pending");

  history.push({role: "user", content: text});
  appendUser(text);
  const ui = appendAssistant();

  const payload = {
    messages: history,
    max_tokens: 1024, temperature: 1.0, top_p: 0.95, stream: true
  };
  if (!$("thinkChk").checked) payload.chat_template_kwargs = {enable_thinking: false};

  let answer = "", think = "";
  try {
    const resp = await fetch("/api/chat", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify(payload)
    });
    if (!resp.ok || !resp.body) {
      let msg = `HTTP ${resp.status}`;
      try { msg = (await resp.json()).error || msg; } catch (e) {}
      throw new Error(msg);
    }
    const reader = resp.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      let idx;
      while ((idx = buf.indexOf("\n")) >= 0) {
        const line = buf.slice(0, idx).trim();
        buf = buf.slice(idx + 1);
        if (!line.startsWith("data:")) continue;
        const data = line.slice(5).trim();
        if (data === "[DONE]") { buf = ""; break; }
        try {
          const j = JSON.parse(data);
          const d = (j.choices && j.choices[0] && j.choices[0].delta) || {};
          if (d.reasoning_content) {
            think += d.reasoning_content;
            ui.thinkBox.style.display = "";
            ui.thinkBody.textContent = think; scrollDown();
          }
          if (d.content) { answer += d.content; ui.ans.textContent = answer; scrollDown(); }
        } catch (e) { /* 忽略不完整行 */ }
      }
    }
    if (!answer && !think) ui.ans.textContent = "(模型未返回内容)";
  } catch (e) {
    ui.err();
    ui.ans.textContent = "出错: " + e.message + "\n（模型服务未启动？点顶部「启动」）";
  } finally {
    ui.cursor.remove();
    if (answer) history.push({role: "assistant", content: answer});
    generating = false; refreshStatus();
  }
}

btnSend.onclick = send;
inp.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && !ev.shiftKey) { ev.preventDefault(); send(); }
});
inp.addEventListener("input", () => {
  inp.style.height = "auto";
  inp.style.height = Math.min(inp.scrollHeight, 160) + "px";
});

/* ---------- 初始化 ---------- */
loadModels();
refreshStatus();
setInterval(refreshStatus, 3000);
appendSys("欢迎使用 ST-AAZeus 本地模型对话台。选择模型点「启动」后即可对话。");
</script>
</body>
</html>
